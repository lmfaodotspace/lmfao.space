	<style>
		/* ---------------------------------------------------------------
		   one self-contained birthday page. everything it needs lives in
		   this folder: index.html, song.mp3, clef.png, photos/
		   --------------------------------------------------------------- */

		:root {
			--ink: #000;
			--bg: #fff;
			--button-size: clamp(140px, 40vmin, 280px);
			--thumb: 90px;   /* set from js to suit the screen */
		}

		*, *::before, *::after { box-sizing: border-box; }

		/* a treble clef for the mouse pointer; 17 1 is its tip, the spot that clicks */
		html, .play {
			cursor: url("clef.png") 17 1, auto;
		}

		body {
			margin: 0;
			min-height: 100svh;
			display: grid;
			place-items: center;
			overflow: hidden;
			background-color: var(--bg);
		}

		/* --- the photos, travelling along a figure eight ------------------ */

		.orbit {
			position: fixed;
			inset: 0;
			pointer-events: none;   /* never block the button */
		}

		.orbit > * {
			--x: 0px;   /* where js puts the photo, from the middle of the screen */
			--y: 0px;
			--box: var(--thumb);   /* the square the photo is fitted into */
			position: absolute;
			top: 50%;
			left: 50%;
			max-width: var(--box);
			max-height: var(--box);
			width: auto;
			height: auto;
			display: block;
			z-index: 1;
			/* centre the photo on its point, move it out to that point, and
			   turn it if the screen is upright (--turn) */
			transform: translate(-50%, -50%) translate(var(--x), var(--y)) rotate(var(--turn, 0deg));
			/* hidden until play is pressed */
			opacity: 0;
			/* on the way back down, stay on top until fully shrunk (the
			   z-index switch waits for the resize to finish) */
			transition:
				opacity 1.2s ease,
				max-width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
				max-height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
				z-index 0s 0.45s;
		}

		/* tall screens: as if the phone were held sideways, the photos are
		   turned a quarter clockwise, the same way as the falling notes */
		.orbit.is-upright > * { --turn: 90deg; }

		.orbit.is-playing > * {
			opacity: 1;
			pointer-events: auto;   /* so each photo can be pointed at */
		}

		/* the photo being looked at is shown 3× bigger; js adds the class.
		   it really is resized, not scaled up with a transform: a transform
		   just stretches the small picture the browser already drew, which
		   looks soft, while a real resize makes it redraw from the full file */
		.orbit > .is-zoomed {
			--box: calc(var(--thumb) * 3);
			z-index: 3;   /* above the letter too */
			/* on the way up, jump to the top straight away */
			transition:
				opacity 1.2s ease,
				max-width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
				max-height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
				z-index 0s;
		}

		/* --- the letter, running along the outside of the ∞ -------------- */

		.letter {
			position: fixed;
			inset: 0;
			z-index: 2;              /* over the photos, under a zoomed one */
			width: 100%;
			height: 100%;
			pointer-events: none;    /* photos underneath still react to the pointer */
			overflow: hidden;
		}

		/* the browser only hides html elements with the hidden attribute
		   by itself, not svg ones like this */
		.letter[hidden] { display: none; }

		.letter text {
			font: bold clamp(14px, 1.6vw, 20px) Arial, Helvetica, sans-serif;
			fill: #39ff14;
			/* a black outline drawn under the fill, so the letters stay full
			   weight and the green pops on white and on the photos alike */
			stroke: #000;
			stroke-width: 3px;
			stroke-linejoin: round;
			paint-order: stroke;
			white-space: pre;        /* keep the gaps between paragraphs */
		}

		/* --- rainbow notes falling in the background ---------------------- */

		.notes {
			position: fixed;
			inset: 0;
			z-index: 0;              /* behind the photos and the letter */
			overflow: hidden;
			pointer-events: none;
		}

		.notes span {
			position: absolute;
			top: 0;
			font-family: Arial, "Apple Symbols", "Segoe UI Symbol", sans-serif;
			font-variant-emoji: text;   /* plain glyph, so the colour shows */
			line-height: 1;
		}

		/* --- the play button ---------------------------------------------- */

		.play {
			position: relative;
			z-index: 4;   /* above everything */
			width: var(--button-size);
			aspect-ratio: 1;
			display: grid;
			place-items: center;
			padding: 0;
			border: 0;
			color: var(--ink);
			background: transparent;
			transition: transform 0.2s ease;
		}

		/* `display: grid` above would otherwise beat the hidden attribute */
		.play[hidden] { display: none; }

		.play:hover { transform: scale(1.05); }

		.play:focus-visible {
			outline: 3px solid var(--ink);
			outline-offset: 6px;
		}

		.play svg {
			width: 100%;
			fill: currentColor;
		}

		@media (prefers-reduced-motion: reduce) {
			.play, .orbit > * { transition: none; }

		}
	</style>
</head>

<body>

	</div>

	<div class="notes" aria-hidden="true"></div>

	<!-- the letter runs along this path; js draws the path to match the ∞ -->
	<svg class="letter" hidden>
		<path id="letter-path" fill="none"/>
		<text><textPath href="#letter-path">Fabi, my baby,   ·   I did not forget you. I am just late to the party. As always.   ·   As time goes by and people leave the picture (to be understood metaphorically, as the film that is my life), you remain. Which makes you one of the oldest standing trees in my tiny personal garden. And also… my <tspan font-style="italic">oldest</tspan> friend. Happy thirstiest (this was a typo, I will keep it) birthday, Fabi.   ·   It's such a sexy age. A sexy decade, really. I hope it brings you the most beautiful things in life: music, food and friendship. Oh, and good stories and literature. Great art, basically.   ·   You are probably my most beautiful and romantic friendship story. I look forward to dragging it on for many more years. I honestly can't wait to see more of the world with you, to help you climb giant birthday cakes, to explore musical niches, culinary feasts and fashion trends, to have endless pillow talks about our hopes and worries, to make sense of nonsense, to have a good-ass time, to goof around. To keep growing together.   ·   I love you so much.   ·   Happy birthday &lt;3</textPath></text>
	</svg>

	<button class="play" type="button" aria-label="play song">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5v17L19 12z"/></svg>
	</button>

	<audio src="song.mp3" preload="none" loop></audio>

	<script>
		/* --- play, then the button is gone -------------------------------- */

		const button = document.querySelector(".play");
		const audio = document.querySelector("audio");

		button.addEventListener("click", () => {
			// only hide the button once the song really starts,
			// so if playback fails it is still there to try again
			audio.play().then(() => {
				button.hidden = true;
				startOrbit();
			});
		});

		/* --- the figure-eight orbit ----------------------------------------
		   each photo sits on a lemniscate (the ∞ curve), evenly spaced, and
		   the whole chain slides along it. on tall screens the ∞ stands up
		   so it uses the height of the phone instead of being tiny.

		   ------------------------------------------------------------------ */

		const orbit = document.querySelector(".orbit");
		const items = [...orbit.children];
		const LAP_SECONDS = 120;   // time for one photo to go all the way round
		const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

		let size, upright;

		function measure() {
			const w = innerWidth, h = innerHeight;
			upright = h > w;
			orbit.classList.toggle("is-upright", upright);
			const long = upright ? h : w;
			const short = upright ? w : h;
			// the ∞ is 2·size long and about 0.7·size across; keep both on screen
			size = Math.min(long * 0.42, short * 1.1);
			// the curve is about 5.2·size long; share it between the photos
			const gap = (size * 5.2) / items.length;
			document.documentElement.style.setProperty("--thumb", `${Math.round(gap * 1.5)}px`);
		}

		// shift: how far round the ∞ the chain has travelled, in radians
		function place(shift) {
			items.forEach((item, i) => {
				const t = (i / items.length) * Math.PI * 2 + shift;
				const s = Math.sin(t), c = Math.cos(t);
				const d = 1 + s * s;
				let x = (size * c) / d;
				let y = (size * s * c) / d;
				if (upright) [x, y] = [y, x];
				// only the position comes from here; the css transform does the rest
				item.style.setProperty("--x", `${x}px`);
				item.style.setProperty("--y", `${y}px`);
			});
		}

		/* --- zoom ------------------------------------------------------------
		   the photo the pointer last landed on is zoomed 3× and stays zoomed
		   as it travels along the ∞, even once it has slid out from under the
		   pointer, the way a tap behaves on a phone. it shrinks back when the
		   pointer moves over empty page (or taps it), or lands on another
		   photo, which then takes over. escape closes it too.

		   the first time a photo is zoomed, a sharper copy is fetched from
		   photos/large/ and swapped in once it has fully loaded, so the page
		   itself stays light and the swap never flashes.
		   ------------------------------------------------------------------ */

		let zoomed = null;

		function sharpen(item) {
			if (item.tagName !== "IMG" || item.dataset.sharp) return;
			item.dataset.sharp = "yes";
			const large = new Image();
			// once it has fully downloaded, swap it in; it comes straight from
			// the cache then, so there's no blank moment
			large.onload = () => { item.src = large.src; };
			large.src = item.getAttribute("src").replace("photos/", "photos/large/");
		}

		function setZoom(item) {
			if (item === zoomed) return;
			zoomed?.classList.remove("is-zoomed");
			zoomed = item;
			if (item) {
				item.classList.add("is-zoomed");
				sharpen(item);
			}
		}

		const photoUnder = event => event.target.closest?.(".orbit > *");

		document.addEventListener("pointerover", event => {
			const item = photoUnder(event);
			if (item) setZoom(item);
		});
		// moving or tapping over empty page closes it
		const closeIfEmpty = event => { if (!photoUnder(event)) setZoom(null); };
		document.addEventListener("pointermove", closeIfEmpty);
		document.addEventListener("pointerdown", closeIfEmpty);
		document.addEventListener("keydown", event => {
			if (event.key === "Escape") setZoom(null);
		});

		/* --- motion: one steady speed, never stopping ----------------------- */

		let shift = 0, startTime;

		function frame(time) {
			startTime ??= time;
			shift = ((time - startTime) / 1000 / LAP_SECONDS) * Math.PI * 2;
			place(shift);
			requestAnimationFrame(frame);
		}

		// photos are laid out (and loading) from the start, but only shown on play
		measure();
		place(0);
		addEventListener("resize", () => { measure(); place(shift); });

		function startOrbit() {
			orbit.classList.add("is-playing");
			if (!reduceMotion) requestAnimationFrame(frame);
			startLetter();
		}

		/* --- the letter ------------------------------------------------------
		   the whole letter is one line of svg text laid along a path: once
		   round a slightly larger ∞ that traces the outside of the photos,
		   with a straight line through its tip to get on and off. the text
		   slides backwards along that path, so it reads like a ticker: it
		   comes in from the edge, goes round the ∞ and carries straight on
		   off the screen, while the rest keeps arriving. when it has all
		   gone by, it starts again.
		   ------------------------------------------------------------------ */

		const LETTER_DELAY = 1500;   // ms after play before the text comes in
		const LETTER_SPEED = 70;     // px per second

		const letter = document.querySelector(".letter");
		const letterPath = document.querySelector("#letter-path");
		const letterText = letter.querySelector("textPath");
		let pathLen = 0, textLen = 0, offset = 0, letterLast;

		// the direction from point a to point b, as a unit vector
		const heading = ([ax, ay], [bx, by]) => {
			const len = Math.hypot(bx - ax, by - ay);
			return [(bx - ax) / len, (by - ay) / len];
		};

		// the letter's full length, measured as one plain line of text off
		// the path. measured on the path itself, safari only counts the
		// letters currently on screen, which comes out near zero at first
		function measureLetter() {
			const probe = letterText.parentNode.cloneNode(true);   // the <text>
			probe.replaceChildren(...probe.firstElementChild.childNodes);   // drop <textPath>
			probe.setAttribute("visibility", "hidden");
			letter.append(probe);
			const length = probe.getComputedTextLength();
			probe.remove();
			return length;
		}

		function drawLetterPath() {
			const w = innerWidth, h = innerHeight;
			textLen = measureLetter();
			letter.setAttribute("viewBox", `0 0 ${w} ${h}`);
			const thumb = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--thumb"));
			const big = size + thumb * 0.7;   // just outside the photos
			const STEPS = 360;
			const margin = 40;   // fully past the screen edge, not just touching it

			// once round the ∞, starting and ending at its tip (the right-hand
			// end on wide screens, the bottom on tall ones)
			const loop = [];
			for (let j = STEPS; j >= 0; j--) {
				const a = (j / STEPS) * Math.PI * 2;
				const sn = Math.sin(a), cs = Math.cos(a), d = 1 + sn * sn;
				let x = (big * cs) / d, y = (-big * sn * cs) / d;
				if (upright) [x, y] = [y, x];
				loop.push([w / 2 + x, h / 2 + y]);
			}

			// the text passes straight through the tip: it comes in along the
			// line that touches the ∞ there, goes round once, and carries on
			// along the same line out the other side. (it runs along the path
			// backwards, so the way out is at the start of the path.)
			const [tx, ty] = loop[0];
			const [dx, dy] = heading(loop[1], loop[0]);   // heading as a lap ends

			// how far from the tip, along direction (ux, uy), to get off screen
			const toEdge = (ux, uy) => Math.min(
				ux > 0 ? (w + margin - tx) / ux : ux < 0 ? (-margin - tx) / ux : Infinity,
				uy > 0 ? (h + margin - ty) / uy : uy < 0 ? (-margin - ty) / uy : Infinity
			);
			// the way out runs on past the screen edge by the whole letter's
			// length. that way the text never needs a negative starting point,
			// which safari doesn't handle reliably (the text froze there)
			const out = toEdge(dx, dy) + textLen, back = toEdge(-dx, -dy);
			const wayOut = [tx + dx * out, ty + dy * out];
			const wayIn = [tx - dx * back, ty - dy * back];

			const points = [wayOut, ...loop, wayIn];
			letterPath.setAttribute("d",
				"M " + points.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(" L "));
			pathLen = letterPath.getTotalLength();
		}

		function letterFrame(time) {
			const dt = letterLast === undefined ? 0 : Math.min((time - letterLast) / 1000, 0.1);
			letterLast = time;
			offset -= LETTER_SPEED * dt;
			// all of it has gone by: start again from the right edge
			if (offset < 0) offset = pathLen;
			letterText.setAttribute("startOffset", offset.toFixed(1));
			requestAnimationFrame(letterFrame);
		}

		function startLetter() {
			setTimeout(() => {
				letter.removeAttribute("hidden");
				drawLetterPath();   // measuring the text needs it on screen
				if (reduceMotion) {
					letterText.setAttribute("startOffset", 0);   // just sits on the ∞
				} else {
					offset = pathLen;   // first letter just off the right edge
					requestAnimationFrame(letterFrame);
				}
			}, reduceMotion ? 0 : LETTER_DELAY);

			if (!reduceMotion) setInterval(dropNote, 450);
		}

		addEventListener("resize", () => { if (!letter.hasAttribute("hidden")) drawLetterPath(); });

		/* --- rainbow notes ---------------------------------------------------
		   a new note every so often, at a random spot along the top, in a
		   random colour, size and speed. each one sways and turns a little on
		   the way down and is removed once it has fallen off the bottom.
		   ------------------------------------------------------------------ */

		const notes = document.querySelector(".notes");
		const NOTE_GLYPHS = ["♪", "♫", "♬", "♩"];
		const random = (min, max) => min + Math.random() * (max - min);

		function dropNote() {
			const note = document.createElement("span");
			note.textContent = NOTE_GLYPHS[Math.floor(Math.random() * NOTE_GLYPHS.length)];
			note.style.fontSize = `${random(18, 54)}px`;
			note.style.color = `hsl(${Math.floor(random(0, 360))} 90% 55%)`;
			notes.append(note);

			const sway = random(-60, 60), spin = random(-45, 45);
			let frames;

			if (upright) {
				// tall screens: as if the phone were held sideways, the notes
				// "fall" from right to left, turned on their side
				note.style.left = "100%";
				note.style.top = `${random(0, 100)}%`;
				frames = [
					{ transform: "translate(0, -50%) rotate(90deg)" },
					{ transform: `translate(calc(-100vw - 100%), calc(-50% + ${sway}px)) rotate(${90 + spin}deg)` },
				];
			} else {
				// wide screens: straight down from the top
				note.style.left = `${random(0, 100)}%`;
				frames = [
					{ transform: "translate(-50%, -100%) rotate(0deg)" },
					{ transform: `translate(calc(-50% + ${sway}px), 100vh) rotate(${spin}deg)` },
				];
			}

			note.animate(frames, { duration: random(6000, 14000), easing: "linear" })
				.finished.then(() => note.remove());
		}
	</script>
